{% extends "base.html" %}
{% block title %}Book a room{% endblock %}
{% block content %}
<h1>Book a room</h1>

{% if result %}
<div class="alert {{ 'alert-success' if result.success else 'alert-danger' }}">
    {{ result.message }}
</div>
{% endif %}

<form method="post" action="/rooms/book" class="row g-3">
    <div class="col-md-6">
        <label class="form-label">Location</label>
        <select name="location_id" class="form-select" required>
            {% for location in locations %}
                <option value="{{ location.location_id }}">{{ location.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-6">
        <label class="form-label">Number of people</label>
        <input type="number" name="number_of_people" class="form-control" min="1" value="4" required>
    </div>
    <div class="col-md-4">
        <label class="form-label">Day</label>
        <input type="date" name="day" class="form-control" required>
    </div>
    <div class="col-md-4">
        <label class="form-label">Start time</label>
        <input type="time" name="start" class="form-control" required>
    </div>
    <div class="col-md-4">
        <label class="form-label">Duration (minutes)</label>
        <input type="number" name="duration_minutes" class="form-control" min="15" step="15" value="60" required>
    </div>
    <div class="col-md-6">
        <label class="form-label">Reference</label>
        <input type="text" name="reference" class="form-control">
    </div>
    <div class="col-md-6">
        <label class="form-label">Description</label>
        <input type="text" name="description" class="form-control">
    </div>
    <div class="col-12">
        <button class="btn btn-primary" type="submit">Book room</button>
    </div>
</form>
{% endblock %}
