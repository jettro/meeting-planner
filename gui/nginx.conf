# The SPA is static files; nginx only has to serve them and get out of the way.
#
# One rule matters: a React router that owns /plan and /trace means the browser
# can ask nginx for a path that was never a file. try_files falls back to
# index.html so a deep link or a reload lands in the app instead of a 404.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames are immutable; index.html must never be.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
