[project]
name = "meeting-server"
version = "0.1.0"
description = "Runs the meeting-planner agent team as a service, for browsers to talk to"
requires-python = ">=3.12"
dependencies = [
    "meeting-agents",
    "akgentic-framework[agent,catalog,infra]>=2.18.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
]

[tool.uv.sources]
meeting-agents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_server"]
