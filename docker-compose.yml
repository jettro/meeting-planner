services:
  meeting-service:
    build:
      context: ./services/meeting-service
    ports:
      - "8001:8001"
      - "8101:8101"
    volumes:
      - meeting-data:/data
    environment:
      MEETING_SERVICE_DB: /data/meeting.db
      MEETING_MCP_API_KEY: ${MEETING_MCP_API_KEY:-dev-meeting-mcp-key}
    # python, not curl: the slim base image has no curl and adding one just
    # for a health check is a bigger surface than the check is worth.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  location-service:
    build:
      context: ./services/location-service
    ports:
      - "8002:8002"
      - "8102:8102"
    volumes:
      - location-data:/data
    environment:
      LOCATION_SERVICE_DB: /data/location.db
      LOCATION_MCP_API_KEY: ${LOCATION_MCP_API_KEY:-dev-location-mcp-key}
    # python, not curl: the slim base image has no curl and adding one just
    # for a health check is a bigger surface than the check is worth.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  nomnom-service:
    build:
      context: ./services/nomnom-service
    ports:
      - "8003:8003"
      - "8103:8103"
    volumes:
      - nomnom-data:/data
    environment:
      NOMNOM_SERVICE_DB: /data/nomnom.db
      NOMNOM_MCP_API_KEY: ${NOMNOM_MCP_API_KEY:-dev-nomnom-mcp-key}
    # python, not curl: the slim base image has no curl and adding one just
    # for a health check is a bigger surface than the check is worth.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # The agent team (design_akgents.md, D7). Not a server: one run plans one
  # meeting and exits, so it sits behind a profile and `make up` ignores it.
  # Start it with `make plan-meeting-docker ARGS="..."`.
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8200:8200"
    # Same reason as the agents runner: seeding happens at startup, so an open
    # port is not the same as usable data.
    depends_on:
      meeting-service:
        condition: service_healthy
      location-service:
        condition: service_healthy
      nomnom-service:
        condition: service_healthy
    volumes:
      - server-data:/data
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-gpt-6-luna}
      # The server builds the teams, so it needs what the agents need.
      MEETING_MCP_URL: http://meeting-service:8101/mcp
      LOCATION_MCP_URL: http://location-service:8102/mcp
      NOMNOM_MCP_URL: http://nomnom-service:8103/mcp
      MEETING_MCP_API_KEY: ${MEETING_MCP_API_KEY:-dev-meeting-mcp-key}
      LOCATION_MCP_API_KEY: ${LOCATION_MCP_API_KEY:-dev-location-mcp-key}
      NOMNOM_MCP_API_KEY: ${NOMNOM_MCP_API_KEY:-dev-nomnom-mcp-key}
      # The REST APIs, for the platform screen - a different port from the MCP
      # servers, and a different question: is the service itself healthy.
      MEETING_SERVICE_URL: http://meeting-service:8001
      LOCATION_SERVICE_URL: http://location-service:8002
      NOMNOM_SERVICE_URL: http://nomnom-service:8003
      # The SPA is served from its own origin, so CORS is not optional here.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8300,http://localhost:8400}

  # The browser client. It talks to the server over the host's port mapping,
  # not over this network, so the API base is a build argument baked into the
  # bundle rather than an environment variable read at runtime.
  gui:
    build:
      context: ./gui
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8200}
    ports:
      - "8300:80"
    depends_on:
      - server

  # The framework's own console (console/README.md). Built straight from the
  # upstream repository at a pinned commit - there is no checkout here, because
  # we want upstream's client, not a fork of it. Configuration is the mounted
  # file, not the build: upstream reads config.json over its baked-in defaults.
  console:
    build:
      context: https://github.com/b12consulting/akgentic-frontend.git#${AKGENTIC_CONSOLE_REF:-e82b549f3873f417af615d878bb85c5333e2f831}
      dockerfile: frontend.Dockerfile
      args:
        BUILD_MODE: production
    ports:
      - "8400:4200"
    volumes:
      - ./console/config.json:/usr/share/nginx/html/config.json:ro
    depends_on:
      - server

  agents:
    build:
      context: ./agents
    profiles: ["agents"]
    # The team asks the human to approve a time slot; that needs a terminal.
    stdin_open: true
    tty: true
    # Seeding runs at startup, so "the port is open" is not the same as "the
    # data is there". Waiting for healthy removes a race we have already hit.
    depends_on:
      meeting-service:
        condition: service_healthy
      location-service:
        condition: service_healthy
      nomnom-service:
        condition: service_healthy
    volumes:
      - agents-data:/data
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-gpt-6-luna}
      # Inside the network each agent reaches exactly one service's MCP server.
      MEETING_MCP_URL: http://meeting-service:8101/mcp
      LOCATION_MCP_URL: http://location-service:8102/mcp
      NOMNOM_MCP_URL: http://nomnom-service:8103/mcp
      MEETING_MCP_API_KEY: ${MEETING_MCP_API_KEY:-dev-meeting-mcp-key}
      LOCATION_MCP_API_KEY: ${LOCATION_MCP_API_KEY:-dev-location-mcp-key}
      NOMNOM_MCP_API_KEY: ${NOMNOM_MCP_API_KEY:-dev-nomnom-mcp-key}

volumes:
  meeting-data:
  location-data:
  nomnom-data:
  server-data:
  agents-data:
