[project]
name = "meeting-agents"
version = "0.1.0"
description = "Akgents agent team that plans meetings through the services' MCP servers"
requires-python = ">=3.12"
dependencies = [
    "akgentic-framework[agent,catalog]>=2.18.1",
    "pydantic>=2.9",
]

[project.scripts]
plan-meeting = "meeting_agents.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_agents"]
