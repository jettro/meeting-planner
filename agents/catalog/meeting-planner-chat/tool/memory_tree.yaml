id: memory_tree
kind: tool
namespace: meeting-planner-chat
user_id: anonymous
model_type: akgentic.tool.workspace.WorkspaceTool
description: >-
  The organiser's memory tree, declared so the console and the server can find
  it (design_memory.md, spike S4). Every capability is off: the model gets no
  file tools from it - MemoryTool does the reading and writing.
payload:
  workspace_id: memory
  read_only: true
  workspace_read: false
  workspace_view: false
  workspace_list: false
  workspace_glob: false
  workspace_grep: false
  expand_media_refs: false
