id: team
kind: team
namespace: meeting-planner
user_id: anonymous
model_type: akgentic.team.TeamCard
description: "The meeting-planner team: a deterministic coordinator and three specialists."
payload:
  name: meeting-planner
  description: >-
    Arranges a meeting end to end: a time every participant is free, a room at
    the chosen location, and lunch. Each specialist reaches exactly one service.
  welcome_message: "Tell me who should meet, on which day, and where."

  # What a run is about, so a list of runs is readable (team_metadata.py). The
  # tagged form is a type reference, the same one message_types uses.
  metadata_type:
    __type__: meeting_agents.team_metadata.MeetingTeamMetadata

  # Who creates whom. The human proxy is the entry point and spawns the
  # coordinator; the coordinator spawns the agents it gives assignments to,
  # and its own state is the meeting's record (design_durability.md);
  # @Catering sits under @FacilityManager because lunch is the facility
  # manager's business, not the coordinator's (D2).
  entry_point:
    card:
      __ref__: human
    headcount: 1
    members:
      - card:
          __ref__: coordinator
        headcount: 1
        members:
          - card:
              __ref__: scheduler
            headcount: 1
            members: []
          - card:
              __ref__: facility_manager
            headcount: 1
            members:
              - card:
                  __ref__: catering
                headcount: 1
                members: []
  members: []

  # A list, deliberately: free-format human input arrives as an extra entry
  # here rather than as a change to any of these (§4.2 rule 5).
  message_types:
    - __type__: meeting_agents.messages.PlanMeetingRequest
    - __type__: meeting_agents.messages.SlotApprovalDecision
    - __type__: meeting_agents.messages.SlotApprovalRequest
    - __type__: meeting_agents.messages.LunchApprovalDecision
    - __type__: meeting_agents.messages.LunchApprovalRequest
    - __type__: meeting_agents.messages.CancelPlanRequest
    - __type__: meeting_agents.messages.PlanCompleted
    - __type__: meeting_agents.messages.PlanFailed
    - __type__: meeting_agents.messages.PlanCancelled
    - __type__: meeting_agents.messages.FindLocationAssignment
    - __type__: meeting_agents.messages.LocationFound
    - __type__: meeting_agents.messages.FindPeopleAssignment
    - __type__: meeting_agents.messages.PeopleFound
    - __type__: meeting_agents.messages.FindPlaceAssignment
    - __type__: meeting_agents.messages.PlaceFound
    - __type__: meeting_agents.messages.FindSlotsAssignment
    - __type__: meeting_agents.messages.SlotsFound
    - __type__: meeting_agents.messages.BookMeetingAssignment
    - __type__: meeting_agents.messages.MeetingBooked
    - __type__: meeting_agents.messages.BookFacilitiesAssignment
    - __type__: meeting_agents.messages.FacilitiesBooked
    - __type__: meeting_agents.messages.OrderLunchAssignment
    - __type__: meeting_agents.messages.LunchOrdered
    - __type__: meeting_agents.messages.AssignmentFailed
    - __type__: meeting_agents.messages.CancelAssignment
    - __type__: meeting_agents.messages.Cancelled

  agent_profiles: []
