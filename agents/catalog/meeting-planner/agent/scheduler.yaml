id: scheduler
kind: agent
namespace: meeting-planner
user_id: anonymous
model_type: akgentic.core.AgentCard
description: "Finds times when every participant is free, and books the meeting."
payload:
  description: "Finds times when every participant is free, and books the meeting."
  agent_class: meeting_agents.specialists.Scheduler
  skills:
    - scheduling
    - availability
  config:
    name: "@Scheduler"
    role: Scheduler
    prompt:
      template:
        __ref__: scheduler_prompt
      params: {}
    # A reasoning model with nine tools can take well over the 120s default,
    # and akgentic's retry policy deliberately does not retry a timeout - so a
    # single slow call would end the whole plan. See design_akgents.md 7.6.
    runtime_cfg:
      http_client_config:
        timeout: 240.0
    model_cfg:
      __ref__: default_model
    tools:
      - __ref__: meeting_mcp
      # The booking rules (design_guardrails.md GR1): a call that books must be
      # the approved one. It gives the model no tool.
      - __ref__: booking_rules
