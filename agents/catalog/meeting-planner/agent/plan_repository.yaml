id: plan_repository
kind: agent
namespace: meeting-planner
user_id: anonymous
model_type: akgentic.core.AgentCard
description: "Owns the plan store. The only writer, so its mailbox serialises writes."
payload:
  description: "Owns the plan store. The only writer, so its mailbox serialises writes."
  agent_class: meeting_agents.plan_repository.PlanRepository
  can_be_hired: false
  skills:
    - persistence
    - correlation
  config:
    name: "@PlanRepository"
    role: PlanRepository
    # Named by dotted path, not constructed here: swapping JSON for a database
    # later is a change to these two values and nothing else.
    store_class: meeting_agents.store.JsonPlanStore
    store_path: "${PLAN_STORE_PATH}"
