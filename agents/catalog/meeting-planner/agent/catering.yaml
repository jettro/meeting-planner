id: catering
kind: agent
namespace: meeting-planner
user_id: anonymous
model_type: akgentic.core.AgentCard
description: "Orders lunch from the NomNom service for a location and date."
payload:
  description: "Orders lunch from the NomNom service for a location and date."
  agent_class: meeting_agents.specialists.Catering
  skills:
    - catering
    - lunch
  config:
    name: "@Catering"
    role: Catering
    prompt:
      template:
        __ref__: catering_prompt
      params: {}
    # A reasoning model with nine tools can take well over the 120s default,
    # and akgentic's retry policy deliberately does not retry a timeout - so a
    # single slow call would end the whole plan. See design_akgents.md 7.6.
    runtime_cfg:
      http_client_config:
        timeout: 240.0
    model_cfg:
      __ref__: default_model
    tools:
      - __ref__: nomnom_mcp
