[project]
name = "meeting-planner"
version = "0.1.0"
description = "Meeting Planner monorepo (meeting, location, and food-ordering services)"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/*"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10", "httpx>=0.27"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's idiomatic use of function calls as parameter defaults (Depends(), Form(), Query(), ...)
#       is a false positive for B008.
# UP042: SQLModel enum columns require inheriting from both `str` and `Enum` (not `StrEnum`) to be
#        stored/serialized correctly as plain string values.
ignore = ["B008", "UP042"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
explicit_package_bases = true
exclude = ["tests/"]

[tool.pytest.ini_options]
# Each service has its own "tests" package; importlib mode avoids module-name
# collisions when running the whole workspace's tests together.
addopts = "--import-mode=importlib"
